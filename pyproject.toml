[project]
name = "process-street-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "datime>=2026.0",
    "httpx>=0.28.1",
    "notch>=2026.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff.lint]
extend-select = ["ANN", "DTZ", "E", "F", "FURB", "I", "ICN", "PERF", "Q", "RSE", "RUF", "S", "UP"]
